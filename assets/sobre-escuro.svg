  <g font-family="'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13.5"><text x="44" y="76" text-anchor="end" fill="#6c6c70">1</text><text x="62" y="76" xml:space="preserve"><tspan fill="#ff7ab2">import</tspan><tspan fill="#f5f5f7"> sqlite3</tspan></text><text x="44" y="98" text-anchor="end" fill="#6c6c70">2</text><text x="44" y="120" text-anchor="end" fill="#6c6c70">3</text><text x="62" y="120" xml:space="preserve"><tspan fill="#f5f5f7">conn = sqlite3.</tspan><tspan fill="#78c2b3">connect</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff8170">"3hic.db"</tspan><tspan fill="#f5f5f7">)</tspan></text><text x="44" y="142" text-anchor="end" fill="#6c6c70">4</text><text x="62" y="142" xml:space="preserve"><tspan fill="#f5f5f7">conn.</tspan><tspan fill="#78c2b3">execute</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff8170">"CREATE TABLE IF NOT EXISTS sobre (chave TEXT, valor TEXT)"</tspan><tspan fill="#f5f5f7">)</tspan></text><text x="44" y="164" text-anchor="end" fill="#6c6c70">5</text><text x="62" y="164" xml:space="preserve"><tspan fill="#f5f5f7">conn.</tspan><tspan fill="#78c2b3">executemany</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff8170">"INSERT INTO sobre VALUES (?, ?)"</tspan><tspan fill="#f5f5f7">, [</tspan></text><text x="44" y="186" text-anchor="end" fill="#6c6c70">6</text><text x="62" y="186" xml:space="preserve"><tspan fill="#f5f5f7">    (</tspan><tspan fill="#ff8170">"linguagem"</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#ff8170">"Python"</tspan><tspan fill="#f5f5f7">), (</tspan><tspan fill="#ff8170">"banco"</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#ff8170">"SQLite3"</tspan><tspan fill="#f5f5f7">),</tspan></text><text x="44" y="208" text-anchor="end" fill="#6c6c70">7</text><text x="62" y="208" xml:space="preserve"><tspan fill="#f5f5f7">    (</tspan><tspan fill="#ff8170">"faz"</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#ff8170">"bots para Discord"</tspan><tspan fill="#f5f5f7">),</tspan></text><text x="44" y="230" text-anchor="end" fill="#6c6c70">8</text><text x="62" y="230" xml:space="preserve"><tspan fill="#f5f5f7">])</tspan></text><text x="44" y="252" text-anchor="end" fill="#6c6c70">9</text><text x="44" y="274" text-anchor="end" fill="#6c6c70">10</text><text x="62" y="274" xml:space="preserve"><tspan fill="#ff7ab2">for</tspan><tspan fill="#f5f5f7"> chave, valor </tspan><tspan fill="#ff7ab2">in</tspan><tspan fill="#f5f5f7"> conn.</tspan><tspan fill="#78c2b3">execute</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff8170">"SELECT * FROM sobre"</tspan><tspan fill="#f5f5f7">):</tspan></text><text x="44" y="296" text-anchor="end" fill="#6c6c70">11</text><text x="62" y="296" xml:space="preserve"><tspan fill="#f5f5f7">    </tspan><tspan fill="#78c2b3">print</tspan><tspan fill="#f5f5f7">(</tspan><tspan fill="#ff8170">f"{chave:&gt;9} </tspan><tspan fill="#ff8170">› {valor}"</tspan><tspan fill="#f5f5f7">)</tspan></text><text x="62" y="342" xml:space="preserve" fill="#a1a1a6">linguagem › Python</text><text x="62" y="363" xml:space="preserve" fill="#a1a1a6">    banco › SQLite3</text><text x="62" y="384" xml:space="preserve" fill="#a1a1a6">      faz › bots para Discord</text></g>
