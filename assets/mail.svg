<title id="titulo">mail: a caixa de entrada da Lain na Wired</title>
<desc id="desc">O programa de e-mail do NAVI. Na caixa: chisa yomoda, &quot;(sem assunto)&quot;, 06 jul; knights, &quot;a verdade única&quot;, 13 jul; tachibana labs, &quot;protocol 7: atualização&quot;, 20 jul; alice mizuki, &quot;vamos na cyberia hoje?&quot;, 27 jul; masami eiri, &quot;a wired é a realidade&quot;, 03 ago; navi, &quot;psyche instalado com sucesso&quot;, 10 ago. Aberta, a mensagem da Chisa: lain, eu não morri. só deixei o meu corpo para trás. aqui na wired todo mundo está conectado. deus está aqui.</desc>
