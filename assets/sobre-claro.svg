  <g font-family="'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13.5"><text x="44" y="76" text-anchor="end" fill="#aeaeb2">1</text><text x="62" y="76" xml:space="preserve"><tspan fill="#ad3da4">import</tspan><tspan fill="#1d1d1f"> sqlite3</tspan></text><text x="44" y="98" text-anchor="end" fill="#aeaeb2">2</text><text x="44" y="120" text-anchor="end" fill="#aeaeb2">3</text><text x="62" y="120" xml:space="preserve"><tspan fill="#1d1d1f">conn = sqlite3.</tspan><tspan fill="#3e8087">connect</tspan><tspan fill="#1d1d1f">(</tspan><tspan fill="#c41a16">"3hic.db"</tspan><tspan fill="#1d1d1f">)</tspan></text><text x="44" y="142" text-anchor="end" fill="#aeaeb2">4</text><text x="62" y="142" xml:space="preserve"><tspan fill="#1d1d1f">conn.</tspan><tspan fill="#3e8087">execute</tspan><tspan fill="#1d1d1f">(</tspan><tspan fill="#c41a16">"CREATE TABLE IF NOT EXISTS sobre (chave TEXT, valor TEXT)"</tspan><tspan fill="#1d1d1f">)</tspan></text><text x="44" y="164" text-anchor="end" fill="#aeaeb2">5</text><text x="62" y="164" xml:space="preserve"><tspan fill="#1d1d1f">conn.</tspan><tspan fill="#3e8087">executemany</tspan><tspan fill="#1d1d1f">(</tspan><tspan fill="#c41a16">"INSERT INTO sobre VALUES (?, ?)"</tspan><tspan fill="#1d1d1f">, [</tspan></text><text x="44" y="186" text-anchor="end" fill="#aeaeb2">6</text><text x="62" y="186" xml:space="preserve"><tspan fill="#1d1d1f">    (</tspan><tspan fill="#c41a16">"linguagem"</tspan><tspan fill="#1d1d1f">, </tspan><tspan fill="#c41a16">"Python"</tspan><tspan fill="#1d1d1f">), (</tspan><tspan fill="#c41a16">"banco"</tspan><tspan fill="#1d1d1f">, </tspan><tspan fill="#c41a16">"SQLite3"</tspan><tspan fill="#1d1d1f">),</tspan></text><text x="44" y="208" text-anchor="end" fill="#aeaeb2">7</text><text x="62" y="208" xml:space="preserve"><tspan fill="#1d1d1f">    (</tspan><tspan fill="#c41a16">"faz"</tspan><tspan fill="#1d1d1f">, </tspan><tspan fill="#c41a16">"bots para Discord"</tspan><tspan fill="#1d1d1f">),</tspan></text><text x="44" y="230" text-anchor="end" fill="#aeaeb2">8</text><text x="62" y="230" xml:space="preserve"><tspan fill="#1d1d1f">])</tspan></text><text x="44" y="252" text-anchor="end" fill="#aeaeb2">9</text><text x="44" y="274" text-anchor="end" fill="#aeaeb2">10</text><text x="62" y="274" xml:space="preserve"><tspan fill="#ad3da4">for</tspan><tspan fill="#1d1d1f"> chave, valor </tspan><tspan fill="#ad3da4">in</tspan><tspan fill="#1d1d1f"> conn.</tspan><tspan fill="#3e8087">execute</tspan><tspan fill="#1d1d1f">(</tspan><tspan fill="#c41a16">"SELECT * FROM sobre"</tspan><tspan fill="#1d1d1f">):</tspan></text><text x="44" y="296" text-anchor="end" fill="#aeaeb2">11</text><text x="62" y="296" xml:space="preserve"><tspan fill="#1d1d1f">    </tspan><tspan fill="#3e8087">print</tspan><tspan fill="#1d1d1f">(</tspan><tspan fill="#c41a16">f"{chave:&gt;9} </tspan><tspan fill="#c41a16">› {valor}"</tspan><tspan fill="#1d1d1f">)</tspan></text><text x="62" y="342" xml:space="preserve" fill="#6e6e73">linguagem › Python</text><text x="62" y="363" xml:space="preserve" fill="#6e6e73">    banco › SQLite3</text><text x="62" y="384" xml:space="preserve" fill="#6e6e73">      faz › bots para Discord</text></g>
